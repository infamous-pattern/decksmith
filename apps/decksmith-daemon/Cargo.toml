[package]
name = "decksmithd"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Bounded asynchronous profile replies retain their independent queue runtime.
async-channel = "2"
async-io = "2"
futures-lite = "2"
libc = "0.2"
decksmith-core.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
decksmith-device.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

serde.workspace = true
signal-hook = "0.3"
zbus = { version = "=6.0.0", default-features = false, features = ["default-rt", "proxy", "service", "tracing"] }
image = { version = "0.25", default-features = false, features = ["png"] }
skrifa = "0.47.0"
tiny-skia = "0.12.0"

[features]
hardware = ["decksmith-device/hardware"]
