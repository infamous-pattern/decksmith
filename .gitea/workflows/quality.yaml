name: Decksmith quality
# Manual until a repository-scoped runner is provisioned and verified.
on:
  workflow_dispatch:
jobs:
  quality:
    runs-on: decksmith-linux
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run the same gate used on Fedora
        run: ./scripts/check.sh
