name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Tested Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Rust checks
        run: |
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo +1.97.1 test --workspace --all-features --locked
      - name: Installer tests
        run: |
          sh -n scripts/install.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -q
      - name: Dependency security audit
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --output /tmp/cargo-deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz' | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny --all-features --locked check
